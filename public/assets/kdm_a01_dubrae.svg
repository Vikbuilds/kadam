<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#242428" />
      <stop offset="100%" stop-color="#0f0f11" />
    </radialGradient>
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#D97706" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="gunmetalMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="35%" stop-color="#334155" />
      <stop offset="70%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    <filter id="bevel">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="5" specularConstant="1" specularExponent="20" lighting-color="#ffffff" result="spec">
        <fePointLight x="200" y="100" z="200"/>
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="spec" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="url(#bgGrad)" />
  
  <!-- Subtle Texture Rings -->
  <circle cx="400" cy="400" r="340" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="2" />
  <circle cx="400" cy="400" r="260" fill="none" stroke="#FF5722" stroke-opacity="0.08" stroke-width="1" />

  <!-- Dubrae 1: Brushed Gold Metal -->
  <g transform="translate(180, 240)" filter="url(#shadow)">
    <!-- Base Plate -->
    <rect x="0" y="0" width="440" height="120" rx="20" fill="url(#goldMetal)" stroke="#FDE68A" stroke-width="2" />
    <!-- Inner Recessed Channel -->
    <rect x="18" y="18" width="404" height="84" rx="12" fill="#78350F" fill-opacity="0.4" stroke="#451A03" stroke-width="2" />
    <!-- Left Eyelet Slot -->
    <rect x="32" y="32" width="28" height="56" rx="6" fill="#18181B" stroke="#B45309" stroke-width="2" />
    <!-- Right Eyelet Slot -->
    <rect x="380" y="32" width="28" height="56" rx="6" fill="#18181B" stroke="#B45309" stroke-width="2" />
    
    <!-- Laser Engraved Text: कदम (Kadam) -->
    <text x="220" y="78" font-family="'Space Grotesk', 'Rozha One', 'Poppins', sans-serif" font-size="52" font-weight="900" fill="#FEF3C7" text-anchor="middle" letter-spacing="4">कदम</text>
    <text x="220" y="96" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FDE68A" text-anchor="middle" letter-spacing="6">KADAM CULTURE</text>
  </g>

  <!-- Dubrae 2: Stealth Gunmetal Chrome -->
  <g transform="translate(180, 440)" filter="url(#shadow)">
    <!-- Base Plate -->
    <rect x="0" y="0" width="440" height="120" rx="20" fill="url(#gunmetalMetal)" stroke="#CBD5E1" stroke-width="2" />
    <!-- Inner Recessed Channel -->
    <rect x="18" y="18" width="404" height="84" rx="12" fill="#020617" fill-opacity="0.5" stroke="#1E293B" stroke-width="2" />
    <!-- Left Eyelet Slot -->
    <rect x="32" y="32" width="28" height="56" rx="6" fill="#09090B" stroke="#475569" stroke-width="2" />
    <!-- Right Eyelet Slot -->
    <rect x="380" y="32" width="28" height="56" rx="6" fill="#09090B" stroke="#475569" stroke-width="2" />
    
    <!-- Laser Engraved Text: कदम (Kadam) -->
    <text x="220" y="78" font-family="'Space Grotesk', 'Rozha One', 'Poppins', sans-serif" font-size="52" font-weight="900" fill="#F8FAFC" text-anchor="middle" letter-spacing="4">कदम</text>
    <text x="220" y="96" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="6">TIE THE NARRATIVE</text>
  </g>

  <!-- High-Tech Street Badge -->
  <g transform="translate(400, 680)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#18181B" stroke="#FF5722" stroke-width="1.5" />
    <text x="0" y="6" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#FF5722" text-anchor="middle" letter-spacing="2">2 PAIRS • SOLID ZINC ALLOY</text>
  </g>
</svg>
