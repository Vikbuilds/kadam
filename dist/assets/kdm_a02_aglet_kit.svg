<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad2" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#242428" />
      <stop offset="100%" stop-color="#0f0f11" />
    </radialGradient>
    <linearGradient id="tinMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="screwGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="agletGunmetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="agletMatteBlack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgGrad2)" />

  <!-- The Custom Sliding Tin Box -->
  <g transform="translate(130, 100)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="540" height="520" rx="28" fill="url(#tinMetal)" stroke="#475569" stroke-width="2.5" />
    <!-- Embossed Inner Tray -->
    <rect x="24" y="24" width="492" height="472" rx="20" fill="#09090B" stroke="#1E293B" stroke-width="2" />
    
    <!-- Tin Branding Header -->
    <text x="270" y="70" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" fill="#FF5722" text-anchor="middle" letter-spacing="5">KADAM CULTURE • LAB HARDWARE</text>
    <line x1="60" y1="88" x2="480" y2="88" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Section 1: Screwdriver Slot -->
    <g transform="translate(60, 110)">
      <!-- Screwdriver Handle -->
      <rect x="0" y="8" width="130" height="24" rx="12" fill="url(#screwGold)" stroke="#B45309" stroke-width="1.5" />
      <!-- Knurled Grip Bands -->
      <line x1="30" y1="8" x2="30" y2="32" stroke="#92400E" stroke-width="2" />
      <line x1="45" y1="8" x2="45" y2="32" stroke="#92400E" stroke-width="2" />
      <line x1="60" y1="8" x2="60" y2="32" stroke="#92400E" stroke-width="2" />
      <line x1="75" y1="8" x2="75" y2="32" stroke="#92400E" stroke-width="2" />
      <line x1="90" y1="8" x2="90" y2="32" stroke="#92400E" stroke-width="2" />
      <!-- Screwdriver Shaft & Magnetic Micro Tip -->
      <rect x="130" y="15" width="220" height="10" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
      <polygon points="350,15 365,18 365,22 350,25" fill="#0F172A" />
      <text x="380" y="24" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#94A3B8">PRECISION TOOL</text>
    </g>

    <!-- Section 2: 4x Gunmetal Tips -->
    <g transform="translate(60, 180)">
      <text x="0" y="16" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" letter-spacing="1">4X GUNMETAL SILVER (316L STEEL)</text>
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="80" height="18" rx="5" fill="url(#agletGunmetal)" stroke="#94A3B8" stroke-width="1" />
        <circle cx="68" cy="9" r="2.5" fill="#09090B" />
        
        <rect x="105" y="0" width="80" height="18" rx="5" fill="url(#agletGunmetal)" stroke="#94A3B8" stroke-width="1" />
        <circle cx="173" cy="9" r="2.5" fill="#09090B" />

        <rect x="210" y="0" width="80" height="18" rx="5" fill="url(#agletGunmetal)" stroke="#94A3B8" stroke-width="1" />
        <circle cx="278" cy="9" r="2.5" fill="#09090B" />

        <rect x="315" y="0" width="80" height="18" rx="5" fill="url(#agletGunmetal)" stroke="#94A3B8" stroke-width="1" />
        <circle cx="383" cy="9" r="2.5" fill="#09090B" />
      </g>
    </g>

    <!-- Section 3: 4x Matte Black Tips -->
    <g transform="translate(60, 270)">
      <text x="0" y="16" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="1">4X MATTE ANODIZED BLACK</text>
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="80" height="18" rx="5" fill="url(#agletMatteBlack)" stroke="#475569" stroke-width="1" />
        <circle cx="68" cy="9" r="2.5" fill="#09090B" />
        
        <rect x="105" y="0" width="80" height="18" rx="5" fill="url(#agletMatteBlack)" stroke="#475569" stroke-width="1" />
        <circle cx="173" cy="9" r="2.5" fill="#09090B" />

        <rect x="210" y="0" width="80" height="18" rx="5" fill="url(#agletMatteBlack)" stroke="#475569" stroke-width="1" />
        <circle cx="278" cy="9" r="2.5" fill="#09090B" />

        <rect x="315" y="0" width="80" height="18" rx="5" fill="url(#agletMatteBlack)" stroke="#475569" stroke-width="1" />
        <circle cx="383" cy="9" r="2.5" fill="#09090B" />
      </g>
    </g>

    <!-- Section 4: 10 Micro Screws Capsule -->
    <g transform="translate(60, 360)">
      <rect x="0" y="0" width="412" height="74" rx="14" fill="#18181B" stroke="#334155" stroke-width="1" />
      <text x="20" y="28" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">10X SPARE MICRO SCREWS INCLUDED</text>
      <g transform="translate(20, 42)">
        <circle cx="10" cy="10" r="6" fill="#F59E0B" /><line x1="7" y1="10" x2="13" y2="10" stroke="#000" stroke-width="1.5" />
        <circle cx="35" cy="10" r="6" fill="#F59E0B" /><line x1="32" y1="10" x2="38" y2="10" stroke="#000" stroke-width="1.5" />
        <circle cx="60" cy="10" r="6" fill="#F59E0B" /><line x1="57" y1="10" x2="63" y2="10" stroke="#000" stroke-width="1.5" />
        <circle cx="85" cy="10" r="6" fill="#F59E0B" /><line x1="82" y1="10" x2="88" y2="10" stroke="#000" stroke-width="1.5" />
        <circle cx="110" cy="10" r="6" fill="#F59E0B" /><line x1="107" y1="10" x2="113" y2="10" stroke="#000" stroke-width="1.5" />
        <circle cx="135" cy="10" r="6" fill="#94A3B8" /><line x1="132" y1="10" x2="138" y2="10" stroke="#000" stroke-width="1.5" />
        <circle cx="160" cy="10" r="6" fill="#94A3B8" /><line x1="157" y1="10" x2="163" y2="10" stroke="#000" stroke-width="1.5" />
        <circle cx="185" cy="10" r="6" fill="#94A3B8" /><line x1="182" y1="10" x2="188" y2="10" stroke="#000" stroke-width="1.5" />
        <circle cx="210" cy="10" r="6" fill="#94A3B8" /><line x1="207" y1="10" x2="213" y2="10" stroke="#000" stroke-width="1.5" />
        <circle cx="235" cy="10" r="6" fill="#94A3B8" /><line x1="232" y1="10" x2="238" y2="10" stroke="#000" stroke-width="1.5" />
      </g>
    </g>
  </g>

  <!-- Bottom CTA Pill -->
  <g transform="translate(400, 690)">
    <rect x="-160" y="-22" width="320" height="44" rx="22" fill="#FF5722" />
    <text x="0" y="6" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">COMPLETE DIY METAL UPGRADE KIT</text>
  </g>
</svg>
